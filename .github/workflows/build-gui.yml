name: Build Desktop GUI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-gui
            path: cli-legacy/dist/quiz_builder_gui
          - os: windows-latest
            artifact: windows-gui
            path: cli-legacy/dist/quiz_builder_gui.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GUI and packaging dependencies
        working-directory: cli-legacy
        run: python -m pip install -e ".[gui,package]"
      - name: Build GUI bundle
        working-directory: cli-legacy
        run: python build_gui.py
      - name: Package Linux bundle
        if: runner.os == 'Linux'
        run: tar -czf interactive-quiz-builder-gui-linux-x86_64.tar.gz -C cli-legacy/dist quiz_builder_gui
      - name: Package Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path cli-legacy/dist/quiz_builder_gui.exe -DestinationPath interactive-quiz-builder-gui-windows-x64.zip -Force
      - name: Upload GUI bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
      - name: Attach Linux bundle to GitHub Release
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: interactive-quiz-builder-gui-linux-x86_64.tar.gz
          generate_release_notes: true
      - name: Attach Windows bundle to GitHub Release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: interactive-quiz-builder-gui-windows-x64.zip
