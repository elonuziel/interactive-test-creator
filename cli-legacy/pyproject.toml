[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interactive-hebrew-quiz-builder"
version = "2.0.0"
description = "Interactive Hebrew quiz builder and player"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.24",
  "pandas>=2.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
quizbuilder = "quizbuilder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
pythonpath = ["src"]
addopts = "-ra"
